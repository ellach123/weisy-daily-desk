<title>潦草鼠鼠之家</title>
<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --surface-2:#EAECE8; --ink:#171B19; --ink-2:#434B47; --muted:#747C78;
  --line:#DCE0DB; --line-2:#C5CAC4;
  --accent:#2A43C0; --accent-ink:#FFFFFF; --accent-soft:#E6E9FA;
  --danger:#B93A2A; --danger-soft:#F8E5E1; --warn:#9E6410; --warn-soft:#F6ECD8;
  --ok:#2B7749; --ok-soft:#DFF0E4; --gold:#B07D0E;
  --scrim:rgba(12,16,14,.34);
  --shadow:0 1px 2px rgba(20,25,22,.06),0 6px 20px rgba(20,25,22,.07);
  --font:"IBM Plex Sans","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
  --mono:"IBM Plex Mono","SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111413; --surface:#191D1B; --surface-2:#222725; --ink:#E7EBE8; --ink-2:#B4BBB7; --muted:#858D89;
    --line:#2B312E; --line-2:#3C433F;
    --accent:#8D9BFF; --accent-ink:#0E1330; --accent-soft:#232A4F;
    --danger:#F0806C; --danger-soft:#3A221E; --warn:#E2AA4E; --warn-soft:#352A17;
    --ok:#5EBB85; --ok-soft:#1B3325; --gold:#E3B341;
    --scrim:rgba(0,0,0,.55);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111413; --surface:#191D1B; --surface-2:#222725; --ink:#E7EBE8; --ink-2:#B4BBB7; --muted:#858D89;
  --line:#2B312E; --line-2:#3C433F;
  --accent:#8D9BFF; --accent-ink:#0E1330; --accent-soft:#232A4F;
  --danger:#F0806C; --danger-soft:#3A221E; --warn:#E2AA4E; --warn-soft:#352A17;
  --ok:#5EBB85; --ok-soft:#1B3325; --gold:#E3B341;
  --scrim:rgba(0,0,0,.55);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

/* ---------- Base ---------- */
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}
.app{max-width:1360px;margin:0 auto;padding-inline:24px;padding-block:0 40px}
@media (max-width:640px){.app{padding-inline:16px}}

/* ---------- Top bar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px}
.brand svg{width:22px;height:22px;color:var(--accent)}
.brand-name{font-weight:600;font-size:17px;letter-spacing:-.01em}
.brand-ver{font:12px var(--mono);color:var(--muted)}
.tabs{display:flex;gap:2px;background:var(--surface-2);padding:3px;border-radius:9px;overflow-x:auto;scrollbar-width:none;max-width:100%}
.tabs::-webkit-scrollbar{display:none}
.tab-badge{display:inline-grid;place-items:center;min-width:17px;height:17px;padding:0 4px;margin-left:6px;border-radius:99px;background:var(--warn);color:#fff;font:500 10px/1 var(--mono);vertical-align:1px}
.tab{padding:5px 16px;border-radius:7px;color:var(--ink-2);font-weight:500;white-space:nowrap}
.tab:hover{color:var(--ink)}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.actions{display:flex;gap:8px;margin-left:auto}
@media (max-width:640px){
  .top{gap:10px}
  .actions{margin-left:auto}
  .tabs{order:3;width:100%}
  .tab{flex:1 0 auto;text-align:center;padding:5px 12px}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.btn.danger{color:var(--danger);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--danger-soft)}
.btn.danger.armed{background:var(--danger);color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:13px}
.btn svg{width:14px;height:14px}

/* ---------- Filters ---------- */
.filters{display:flex;gap:10px 14px;align-items:center;flex-wrap:wrap;padding-block:14px 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;flex:1 1 480px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:13px}
.chip:hover{border-color:var(--line-2);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip .sw{width:8px;height:8px;border-radius:2px;background:var(--c)}
.chip .n{font:11px var(--mono);opacity:.7}
.fctl{display:flex;gap:8px;align-items:center}
/* mascots on 看板 / 任务 / 副业 (original drawings), in each page's empty top-right space */
.filters{position:relative}
.page-mouse{position:absolute;right:8px;top:4px;width:92px;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.gig-head{position:relative}
.gig-mouse{position:absolute;right:calc(200px + 17mm);bottom:calc(-37px - 2mm);width:84px;height:auto;pointer-events:none;user-select:none;-webkit-user-drag:none}
.board-mouse{width:90px;height:auto;display:block;pointer-events:none;user-select:none;-webkit-user-drag:none}
@media (max-width:640px){.page-mouse{width:60px}.gig-mouse{width:56px;right:170px;bottom:-38px}.board-mouse{display:none}}
.field{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:0 10px;min-width:0}
.field:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.search{width:190px}
@media (max-width:640px){.fctl{width:100%}.search{flex:1;width:auto}}

/* ---------- Shared bits ---------- */
.atag{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:4px 7px;border-radius:5px;background:color-mix(in srgb,var(--c) 14%,transparent);color:var(--ink);white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;gap:6px 20px;margin:10px 0 0;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:2px;background:var(--c)}
.legend b{font-weight:600;color:var(--ink)}
.card-foot:empty,.pcard-main .pmeta:empty{display:none}
.atag i{width:7px;height:7px;border-radius:2px;background:var(--c);flex:none}
.proj{font-size:12px;color:var(--muted);min-width:0}
.due{font:12px/1 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.due.soon{color:var(--warn)}
.due.over{color:var(--danger);font-weight:500}
.pill{display:inline-flex;align-items:center;font-size:11px;line-height:1;padding:4px 8px;border-radius:99px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.pill.active{border-color:transparent;background:var(--accent-soft);color:var(--accent)}
.pill.later,.pill.paused{color:var(--muted);border-style:dashed}
.pill.done{border-color:transparent;background:var(--ok-soft);color:var(--ok)}
.muted{color:var(--muted)}
.state{padding:80px 16px;text-align:center;color:var(--muted);max-width:44ch;margin:0 auto}
.state strong{display:block;color:var(--ink);font-size:16px;margin-bottom:6px}

/* ---------- Task rows ---------- */
.rows{list-style:none;margin:0;padding:0}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.check{flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--line-2);border-radius:5px;display:grid;place-items:center;background:var(--surface)}
.check:hover{border-color:var(--ok)}
.check svg{width:12px;height:12px;stroke:#fff;fill:none;stroke-width:2.2;opacity:0}
.is-done .check{background:var(--ok);border-color:var(--ok)}
.is-done .check svg{opacity:1}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.row-title{color:var(--ink);overflow-wrap:anywhere}
.row-main:hover .row-title{color:var(--accent)}
.is-done .row-title{text-decoration:line-through;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.empty-note{color:var(--muted);font-size:13px;padding:8px 0}

/* ---------- Today ---------- */
.today-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px}
.today-head h1{font-size:28px;font-weight:600;letter-spacing:-.015em;margin:0;line-height:1.2}
.today-head h1 span{font-weight:400;color:var(--muted);font-size:18px;margin-left:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px 8px}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.panel-h h2{font-size:14px;font-weight:600;margin:0}
.hint{font-size:12px;color:var(--muted)}

/* ---------- Board ---------- */
.board-wrap{overflow-x:auto;padding-bottom:8px;margin-top:8px}
.board{display:grid;grid-template-columns:repeat(4,minmax(232px,1fr));gap:12px}
@media (max-width:900px){
  .board{grid-template-columns:repeat(4,minmax(260px,84vw))}
  .board-wrap{scroll-snap-type:x mandatory}
  .col{scroll-snap-align:start}
}
.col{background:var(--surface-2);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-height:260px;min-width:0}
.col-h{display:flex;align-items:center;gap:8px;padding:2px 4px 0}
.col-name{font-weight:600}
.count{font:12px var(--mono);color:var(--muted)}
.col-sub{font-size:12px;color:var(--muted);padding:0 4px;margin-top:-6px}
.sd{width:11px;height:11px;border-radius:50%;flex:none;border:2px solid var(--muted)}
.sd.doing{border-color:var(--accent);background:linear-gradient(90deg,var(--accent) 50%,transparent 50%)}
.sd.waiting{border-color:var(--warn);border-style:dashed}
.sd.done{border-color:var(--ok);background:var(--ok)}
.col-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;min-height:64px;flex:1}
html[lang="en"] .col-list:empty::before{content:"Drop here"}
.col-list:empty::before{content:"拖到这里";display:grid;place-items:center;height:64px;border:1px dashed var(--line-2);border-radius:8px;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:grab;display:flex;flex-direction:column;gap:6px;touch-action:manipulation}
.card:hover{border-color:var(--line-2)}
.card-top{display:flex;gap:8px;align-items:center;min-width:0}
.card-top .proj{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-title{font-weight:500;line-height:1.4;overflow-wrap:anywhere}
.card-next{font-size:12px;color:var(--ink-2);line-height:1.45}
.card-next b{font-weight:500;color:var(--muted)}
.card-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.col[data-status="done"] .card-title{color:var(--muted);text-decoration:line-through}
.ghost{opacity:.35}
.chosen{box-shadow:var(--shadow)}
.quick input{width:100%;height:34px;border:1px dashed var(--line-2);background:transparent;border-radius:8px;padding:0 10px}
.quick input:focus{outline:none;border-style:solid;border-color:var(--accent);background:var(--surface)}
.more{font-size:12px;color:var(--muted);padding:4px;text-decoration:underline;text-underline-offset:3px}

/* ---------- Projects ---------- */
.view-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:14px}
.view-head h1{font-size:22px;font-weight:600;margin:0}
.tier{margin-top:24px}
.tier-h{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:4px}
.tier-h::after{content:"";flex:1;height:1px;background:var(--line)}
.area-block{margin-top:14px}
.area-h{display:flex;align-items:center;gap:8px;font-weight:600;margin-bottom:10px}
.area-h i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.area-h .n{font:12px var(--mono);color:var(--muted);font-weight:400}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:9px;width:100%}
.pcard:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.pcard-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard h3{margin:0;font-size:15px;font-weight:600;line-height:1.35}
.goal{color:var(--ink-2);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:0}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--c);border-radius:99px}
.pmeta{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.pmeta .num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.pnext{font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:8px;display:flex;justify-content:space-between;gap:8px}
.pnext span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard{padding:0;gap:0}
.pcard.is-done{opacity:.6}
.pcard-main{display:flex;flex-direction:column;gap:9px;padding:14px;width:100%;text-align:left;border-radius:12px}
.pcard-main:hover h3{color:var(--accent)}
.pcard-main .pmeta{justify-content:flex-start;gap:8px}
.pcard h3{overflow-wrap:anywhere}
.pgrid{align-items:start}
.pcard-ms{display:flex;flex-direction:column;gap:7px;padding:10px 14px 12px;width:100%;text-align:left;border-top:1px solid var(--line);border-radius:0 0 12px 12px}
.pcard-ms:hover{background:var(--surface-2)}
.pcard-ms .pnext,.pcard-main .pnext{border-top:0;padding-top:0}
.area-empty{font-size:13px;color:var(--muted);border:1px dashed var(--line-2);border-radius:12px;padding:14px}

/* ---------- Drawer & modal ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim)}
#drawer .scrim{z-index:40}
#modal .scrim{z-index:50}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:20px}
@media (max-width:640px){.drawer{padding-inline:16px}}
.d-top{display:flex;align-items:center;gap:10px}
.d-top .sp{flex:1}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:8px;color:var(--muted)}
.x:hover{background:var(--surface-2);color:var(--ink)}
.x svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none}
.d-title{font-size:22px;font-weight:600;margin:0;line-height:1.3}
.d-goal{margin:6px 0 0;color:var(--ink-2);max-width:62ch;white-space:pre-wrap}
.d-stats{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted);align-items:center}
.d-stats .bar{flex:1 1 160px}
.dsec{display:flex;flex-direction:column}
.dsec h3{font-size:14px;font-weight:600;margin:0 0 4px;display:flex;gap:8px;align-items:baseline}
.dsec h3 .n{font:12px var(--mono);color:var(--muted);font-weight:400}
.dsec .panel{padding:6px 14px}
.d-edit{width:100%;height:38px;font-size:14px}
textarea.d-notes{height:auto;min-height:64px;padding:9px 10px;line-height:1.6;resize:none;overflow:hidden}
.ms{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.ms:first-child{border-top:0}
.ms .t{flex:1;min-width:0}
.ms.is-done .t{text-decoration:line-through;color:var(--muted)}
.mini-x{width:24px;height:24px;display:grid;place-items:center;border-radius:6px;color:var(--muted);opacity:.6}
.mini-x:hover{opacity:1;color:var(--danger);background:var(--danger-soft)}
.mini-x svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none}
.inline-add{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inline-add .field{flex:1 1 180px}
.inline-add .field[type="date"]{flex:0 1 150px}
.group-label{font-size:12px;color:var(--muted);margin:10px 0 0}
.log{list-style:none;margin:0;padding:0}
.log li{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.log li:first-child{border-top:0}
.log .date{font:12px var(--mono);color:var(--muted);padding-top:2px}
.log .txt{white-space:pre-wrap;overflow-wrap:anywhere}
.log .tag{font:500 11px var(--mono);color:var(--accent);margin-right:6px}
.lg-st{display:inline-block;width:1.3em;color:var(--muted)}
.lg-st.done{color:var(--ok)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(600px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--surface);border-radius:14px;z-index:51;padding:20px 22px;box-shadow:var(--shadow)}
.modal h2{margin:0 0 14px;font-size:18px;font-weight:600}
.form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--ink-2);min-width:0}
.f .field{width:100%;height:36px;font-size:14px}
.f textarea.field{height:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:1fr 1fr}.grid3 .f:last-child{grid-column:1/-1}}
.checkline{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink)}
.checkline input{width:16px;height:16px;accent-color:var(--accent)}
.mfoot{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.mfoot .sp{flex:1}

/* ---------- V2 shared ---------- */
.h1-sub{font-size:14px;font-weight:400}
.page-note{font-size:13px;color:var(--muted);margin:6px 0 0}
.linkbtn{color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-size:12px}
.inline-row{display:flex;gap:8px;align-items:center}
.inline-row .field{flex:1;min-width:0}
.row>.btn{flex:none;align-self:center}
.chip.add{border-style:dashed;color:var(--muted)}
.imlist{list-style:none;margin:10px 0;padding:0;display:grid;gap:4px}
.imlist li{display:flex;justify-content:space-between;max-width:280px;font-size:13px}
.imlist b{font:500 13px var(--mono)}

/* ---------- 副业 ---------- */
.gstats{display:flex;gap:6px 22px;flex-wrap:wrap;font-size:13px;color:var(--muted);align-items:baseline}
.gstats b{font:500 18px var(--mono);color:var(--ink);margin-right:6px;font-variant-numeric:tabular-nums}
.ptabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:16px}
.grow{display:flex;align-items:center;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-top:16px}
.grow .ptabs{margin-top:0;flex:1 1 auto}
.gacts{display:flex;align-items:center;gap:8px;margin-left:auto}
.gnote-line{margin:8px 0 0;font-size:13px;color:var(--ink-2)}
.glist{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.gig-empty{margin-top:10px}
.gplat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 16px}
.gplat-h{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.gplat-h .name{font-weight:600;font-size:15px}

.hp-stat{font-size:12px;color:var(--muted)}

.hm{display:grid;grid-template-columns:auto auto;gap:4px 6px;width:max-content}

.hsearch{margin-top:12px;width:100%;max-width:320px}
.hrecent{margin:8px 0 0;padding:0;list-style:none}

.tagset{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.tagbtn{height:30px;padding:0 12px;border-radius:99px;border:1px solid var(--line-2);background:var(--surface);font-size:13px;color:var(--ink)}

.tagbtn[aria-pressed="true"]{background:var(--c,var(--accent));border-color:var(--c,var(--accent));color:#fff}
.tagadd{display:flex;gap:6px;margin-top:6px}
.tagadd .field{width:150px;height:30px}

/* ---------- 今日清单 ---------- */
#dv-head{position:relative}
.dv-pal{position:absolute;right:6px;bottom:-8px;display:flex;align-items:flex-end;gap:6px;pointer-events:none}
.dv-bubble{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 18px;font-size:13px;color:var(--ink-2);white-space:nowrap;margin-bottom:46px;box-shadow:var(--shadow)}
.dv-bubble::after{content:"";position:absolute;right:-5px;bottom:9px;width:10px;height:10px;background:var(--surface);border-right:1px solid var(--line);border-bottom:1px solid var(--line);border-bottom-right-radius:3px;transform:rotate(-45deg)}
.dv-mouse{width:100px;height:auto;display:block;user-select:none;-webkit-user-drag:none}

.dv-textrow{display:flex;align-items:center;gap:8px;min-width:0}

.foot{margin-top:48px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:8px 16px;flex-wrap:wrap;justify-content:space-between}

const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const parseD = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d); };
const diffDays = s => Math.round((parseD(s) - parseD(todayStr())) / 86400000);
const md = s => { const [, m, d] = s.split('-').map(Number); return tr('date.md', { m, d }); };
const weekday = s => tr('date.wd', { w: new Date(parseD(s)).getUTCDay() });
const rid = () => Math.random().toString(36).slice(2, 10);
const byOrder = (a, b) => (a.order ?? 0) - (b.order ?? 0);
const byDue = (a, b) => (a.due || '9999') < (b.due || '9999') ? -1 : (a.due || '9999') > (b.due || '9999') ? 1 : byOrder(a, b);
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };

/* The first run's examples in both languages (starter.json, starter.en.json; filled in by tools/build.py).
   Switching the language switches an example's text too, but only where it is still exactly the example's
   text in the other language: whatever the user changed or added stays as it is. A habit's options only
   switch while it has no check-ins, so old check-ins never name options that are gone. */
const STARTERS = __WEISY_STARTERS__;
const EXAMPLE_FIELDS = { areas: ['name', 'desc'], tasks: ['title', 'next'], gigPaths: ['name', 'platformLabel', 'projectLabel'], gigs: ['name'], habits: ['name', 'didLabel'] };
function switchExamples(to) {
  const from = STARTERS[to === 'en' ? 'zh' : 'en'], into = STARTERS[to];
  if (!from || !into) return;
  Object.entries(EXAMPLE_FIELDS).forEach(([col, fields]) => S[col].forEach(doc => {
    const a = from[col]?.[doc.id], b = into[col]?.[doc.id];
    if (!a || !b) return;
    const patch = {};
    fields.forEach(f => { if (doc[f] === a[f] && typeof b[f] === 'string' && b[f] !== a[f]) patch[f] = b[f]; });
    if (col === 'tasks' && Array.isArray(doc.milestones)) {
      let changed = false;
      const ms = doc.milestones.map(m => {
        const am = (a.milestones || []).find(x => x.id === m.id), bm = (b.milestones || []).find(x => x.id === m.id);
        if (!am || !bm || m.title !== am.title || am.title === bm.title) return m;
        changed = true; return { ...m, title: bm.title };
      });
      if (changed) patch.milestones = ms;
    }
    if (col === 'habits' && (a.tags || []).length && JSON.stringify(doc.tags || []) === JSON.stringify(a.tags)
        && !S.habitLogs.some(l => l.habitId === doc.id)) patch.tags = [...b.tags];
    if (Object.keys(patch).length) upd(col, doc.id, patch);
  }));
  // the example today-list lives under the date of the first run
  const ai = from.daily?.__today__?.items || [], bi = into.daily?.__today__?.items || [];
  S.daily.forEach(d => {
    let changed = false;
    const items = dayItems(d.id).map(it => {
      const x = ai.find(e => e.id === it.id), y = bi.find(e => e.id === it.id);
      if (!x || !y || it.text !== x.text || x.text === y.text) return it;
      changed = true; return { ...it, text: y.text };
    });
    if (changed) dvWrite(d.id, items);
  });
}

/* ================= Data layer =================
   Every read and write goes through Store, backed by local-store.js (the local server).
   To use another backend, give Store.db an object with the same collection()/doc()
   calls, or rewrite these five methods — nothing else in the page touches storage. */
const COLLECTIONS = ['areas', 'tasks', 'gigPaths', 'gigs', 'habits', 'habitLogs', 'settings', 'daily'];
const Store = {
  db: null,
  subscribe(col, onData, onError) { return this.db.collection(col).onSnapshot(snap => onData(snap.docs.map(d => ({ id: d.id, ...d.data() }))), onError); },
  newId(col) { return this.db.collection(col).doc().id; },
  set(col, id, data) { return this.db.doc(`${col}/${id}`).set(data); },
  update(col, id, patch) { return this.db.doc(`${col}/${id}`).update(patch); },
  remove(col, id) { return this.db.doc(`${col}/${id}`).delete(); },
};

/* One write at a time per document; every write reports failure in a toast. */
const queues = new Map();
function queued(path, fn) {
  const prev = queues.get(path) || Promise.resolve();
  const p = prev.catch(() => {}).then(fn);
  queues.set(path, p);
  return p.then(() => true, e => { toast(errText(e)); return false; })
    .finally(() => { if (queues.get(path) === p) queues.delete(path); });
}
const upd = (col, id, patch) => queued(`${col}/${id}`, () => Store.update(col, id, patch));
const put = (col, id, data) => queued(`${col}/${id}`, () => Store.set(col, id, data));
const del = (col, id) => queued(`${col}/${id}`, () => Store.remove(col, id));
const newId = col => Store.newId(col);
function errText(e) {
  switch (e && e.code) {
    case 'resource_exhausted': return tr('err.busy');
    case 'invalid_argument': return tr('err.invalid');
    default: return tr('err.save');
  }
}

function currentModule() { return MODULES.find(m => m.id === S.view) || MODULES[0]; }
/* Tab order is saved in settings/ui (tabOrder); keys 1–9 follow the order shown. */
const uiSettings = () => { const { id, ...rest } = S.settings.find(d => d.id === 'ui') || {}; return rest; };
function modulesOrdered() {
  const ord = uiSettings().tabOrder || [];
  const rank = id => { const i = ord.indexOf(id); return i < 0 ? 100 + MODULES.findIndex(m => m.id === id) : i; };
  return [...MODULES].sort((a, b) => rank(a.id) - rank(b.id));

function mountTabs() {

    forceFallback: true, fallbackTolerance: 5, delay: 200, delayOnTouchOnly: true, direction: 'horizontal', ghostClass: 'ghost',
    onStart() { S.dragging = true; },

function writeDay(hid, date, entry) {
  const cur = logDoc(hid, date);
  const days = { ...(cur?.days || {}) };
  if (entry) days[date] = entry; else delete days[date];
  const id = logId(hid, date);
  if (!Object.keys(days).length) return del('habitLogs', id);
  return put('habitLogs', id, { habitId: hid, month: date.slice(0, 7), days });
}

  if (h.mins) { const v = String(fd.get('mins') || '').trim(); entry.mins = v === '' ? '' : Math.max(0, Number(v) || 0); }
  if (h.longNote) entry.note = String(fd.get('note') || '').trim();
  const { hid, date } = m;
  closeModal();

}

function deleteHabit(hid) {

/* ================= Import backup ================= */
const ID_RE = /^(?!\.\.?$)[A-Za-z0-9_\-.~:@+]{1,200}$/;
function readImport(file) {
  const r = new FileReader();
  r.onload = () => {
    let data;
    try { data = JSON.parse(String(r.result)); } catch { return toast(tr('im.bad')); }
    const counts = COLLECTIONS.map(c => [c, Array.isArray(data?.[c]) ? data[c].filter(d => d && typeof d === 'object' && ID_RE.test(String(d.id || ''))).length : 0]).filter(([, n]) => n);
    if (!counts.length) return toast(tr('im.empty'));
    S.modal = { kind: 'import', data, returnFocus: document.activeElement };
    const box = $('#modal');
    box.innerHTML = `<div class="scrim" data-act="close-modal"></div>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="im-h">
      <h2 id="im-h">${tr('import.btn')}</h2>
      <p>${tr('im.file', { f: esc(file.name), at: data.exportedAt ? esc(String(data.exportedAt).slice(0, 10)) : '' })}</p>
      <ul class="imlist">${counts.map(([c, n]) => `<li>${tr('im.row', { c: tr('col.' + c), n })}</li>`).join('')}</ul>
      <p class="page-note">${tr('im.note')}</p>
      <div class="mfoot"><span class="sp"></span>
        <button type="button" class="btn sm" data-act="close-modal">${tr('cancel')}</button>
        <button type="button" class="btn primary sm" data-act="import-go">${tr('im.go')}</button></div>
    </div>`;
    box.hidden = false;
  };
  r.onerror = () => toast(tr('im.readFail'));
  r.readAsText(file);
}
async function runImport() {
  const data = S.modal && S.modal.data; if (!data) return;
  closeModal();
  let n = 0, fail = 0;
  for (const c of COLLECTIONS) {
    for (const d of (Array.isArray(data[c]) ? data[c] : [])) {
      if (!d || typeof d !== 'object' || !ID_RE.test(String(d.id || ''))) continue;
      const { id, ...rest } = d;
      if (await put(c, String(id), rest)) n++; else fail++;
      if ((n + fail) % 25 === 0) toast(tr('im.progress', { n: n + fail }));
    }
  }
  toast(tr('im.done', { n, fail }));
}

  switch (el.dataset.act) {
    case 'gpath': S.gigPath = id; lsSet('weisy.gpath', id); renderMain(); break;

    case 'gpath-del': if (armed(el, el.dataset.confirm)) { closeModal(); deletePath(id); } break;
    case 'gig-new-plat': openGig(null, { kind: 'platform', pathId: id }); break;
    case 'gig-edit': openGig(id); break;
    case 'gig-del': if (armed(el, el.dataset.confirm)) { closeModal(); deleteGig(id); } break;
    case 'habit-day': openCheckin(hid, el.dataset.d); break;
    case 'habit-all': S.habitOpen.has(hid) ? S.habitOpen.delete(hid) : S.habitOpen.add(hid); renderMain(); break;
    case 'habit-new': openHabitForm(null); break;

/* ================= Module: 今日（今日清单） =================
   One document per day: daily/<YYYY-MM-DD> = { date, items: [{ id, text, done, doneAt, areaId, taskId, noSuggest }] }.
   Array order is display order. Unfinished items stay on their own day (never carried over). */
const DV = { date: null, local: new Map(), pending: false, showDone: false, moving: null, moveDate: '', newArea: '', newTask: '', newSugOff: false };
const dvClone = o => JSON.parse(JSON.stringify(o));
const dvStable = v => JSON.stringify(v, (k, x) => x && typeof x === 'object' && !Array.isArray(x)
  ? Object.keys(x).sort().reduce((o, kk) => { o[kk] = x[kk]; return o; }, {}) : x);
const dayDoc = date => S.daily.find(d => d.id === date);
/* Writes are kept locally until the store echoes them back, so quick successive edits never read a stale list. */
function dayItems(date) {
  const stored = (dayDoc(date) || {}).items || [];
  const l = DV.local.get(date);
  if (l && dvStable(l) === dvStable(stored)) DV.local.delete(date);
  return dvClone(DV.local.get(date) || stored);
}
function dvWrite(date, items) {
  DV.local.set(date, dvClone(items));
  renderMain();
  return items.length ? put('daily', date, { date, items, updatedAt: new Date().toISOString() }) : del('daily', date);
}
function dvPatch(id, fn) {
  const items = dayItems(DV.date), it = items.find(x => x.id === id);
  if (!it) return;
  fn(it);
  dvWrite(DV.date, items);
}
const trunc = (s, n) => { const c = [...String(s || '')]; return c.slice(0, n).join('') + (c.length > n ? '…' : ''); };

/* ---------- suggesting a parent task from the words typed ---------- */
const SUG_STOP = new Set(['示例', '项目', '一份', '一些', '可以', '然后', '自己', '进行', '我的', '并且', '或者', '的工', '工作', '今天', '一下']);
/* English filler words never count as a match (the English examples all start with "Example:"). */
const SUG_STOP_EN = new Set(['example', 'the', 'and', 'for', 'with', 'from', 'into', 'about', 'some', 'this', 'that', 'my', 'to', 'of', 'in', 'on', 'at', 'up', 'do', 'get', 'new', 'one', 'today']);
function sugTokens(s) {
  const t = String(s || '').toLowerCase();
  const words = new Set((t.match(/[a-z0-9]{2,}/g) || []).filter(w => !SUG_STOP_EN.has(w)));
  const bi = new Set();
  t.replace(/[^一-鿿]+/g, ' ').split(' ').filter(Boolean).forEach(seg => {
    for (let i = 0; i + 1 < seg.length; i++) { const b = seg.slice(i, i + 2); if (!SUG_STOP.has(b)) bi.add(b); }
  });
  return { words, bi };
}
function dvSuggest(text) {
  const a = sugTokens(text);
  if (!a.words.size && !a.bi.size) return null;
  let best = null, top = 0;
  S.tasks.filter(t => t.status !== 'done').sort(byOrder).forEach(t => {
    const b = sugTokens(t.title);
    let sc = 0;
    a.words.forEach(w => { if (b.words.has(w)) sc += w.length >= 4 ? 3 : 2; });
    a.bi.forEach(x => { if (b.bi.has(x)) sc += 1; });
    if (sc > top) { top = sc; best = t; }
  });
  return best;
}

/* ---------- links shown on the tasks ---------- */
function dailyLinks(taskId) {
  const out = [];
  const dates = new Set([...S.daily.map(d => d.id), ...DV.local.keys()]);
  dates.forEach(date => dayItems(date).forEach(it => { if (it.taskId === taskId) out.push({ date, ...it }); }));
  return out.sort((a, b) => b.date.localeCompare(a.date));
}
function dailyLine(taskId) {
  const ls = dailyLinks(taskId); if (!ls.length) return '';
  const td = todayStr(), mon = mondayOf(td);
  const week = ls.filter(x => x.date >= mon && x.date <= td).length;
  return tr('dv.linked', { week, last: md(ls[0].date) });
}
/* A task's 进展日志 is built from the today-list items linked to it, so it always follows the list
   (ticked, edited, moved, deleted). Entries in the task's own log (if any) join the same timeline. */
function progressLog(t) {
  const auto = dailyLinks(t.id).map(x => ({ date: x.date, text: x.text, done: !!x.done, auto: true }));
  const manual = (t.log || []).map(l => ({ date: l.date || '', text: l.text, tag: l.tag, id: l.id }));
  return [...auto, ...manual].sort((a, b) => b.date.localeCompare(a.date));
}

}

/* Move an unfinished item to the end of another day's list (any day but the one shown). It keeps its

   it sits on another day. The target day is written first, so a failed second write can only leave a
   duplicate, never lose the item. */
async function dvMoveTo(id, target) {
  const src = DV.date;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(target || '') || target === src) return;
  const it = dayItems(src).find(x => x.id === id);
  if (!it || it.done) return;
  const dest = dayItems(target).filter(x => x.id !== id);
  dest.push({ ...it, since: it.since || src, done: false, doneAt: '' });
  DV.moving = null;
  if (!(await dvWrite(target, dest))) return;
  await dvWrite(src, dayItems(src).filter(x => x.id !== id));

      <button class="btn ghost sm" data-act="dv-day" data-d="${prev}">‹ ${cnDate(prev)}</button>
      <h2>${isToday ? tr('dv.title') : `${cnDate(date)} ${weekday(date)}`}${items.length ? `<span class="dv-count">${tr('dv.count', { done, total: items.length })}</span>` : ''}</h2>
      <span class="dv-navr">${isToday ? '' : `<button class="btn ghost sm" data-act="dv-day" data-d="${td}">${tr('dv.backToday')}</button>`}<button class="btn ghost sm" data-act="dv-day" data-d="${next}">${cnDate(next)} ›</button></span>
    </header>
    <form class="dv-add" data-form="dv-add"><input class="field" id="dv-input" name="text" placeholder="${isToday ? tr('dv.ph.today') : tr('dv.ph.day', { date: cnDate(date) })}" autocomplete="off" aria-label="${tr('dv.add')}">
      <select id="dv-new-area" aria-label="${tr('dv.newArea')}" ${dvNewAreaAttrs()}>${dvNewAreaOptions()}</select>
      <select id="dv-new-task" aria-label="${tr('dv.newTask')}">${dvTaskOptions({ areaId: typeId(DV.newArea), taskId: DV.newTask })}</select></form>
    <div id="dv-new-sug" class="dv-new-sug"></div>
    ${items.length ? `<ul class="dv-list" id="dv-list">${items.map(dvRow).join('')}</ul>` : `<p class="empty-note dv-empty">${isToday ? tr('dv.empty.today') : tr('dv.empty.day')}</p>`}
  </section>
  ${renderBigTasks()}
  </div>`;
}
/* Right column: every task, flat, each with its own 主线 / 支线 / 长期 tag. */
function bigTaskItem(t, todayIds) {
  const done = t.status === 'done';
  const n = todayIds.filter(x => x === t.id).length;
  return `<li><button class="bt-item${n ? ' on' : ''}${done ? ' bt-done' : ''}" data-act="open-ms" data-id="${t.id}" title="${esc(t.title)}">
    <span class="sd ${t.status}" aria-hidden="true"></span>
    <span class="bt-body">
      <span class="bt-title">${esc(t.title)}</span>
      <span class="bt-meta">${areaTag(typeOf(t.areaId))}${dueBadge(t.due, done)}${n ? `<span class="bt-today">${tr('bt.today', { n })}</span>` : ''}</span>
    </span>
  </button></li>`;
}
function renderBigTasks() {
  const rank = new Map(areasSorted().map((a, i) => [a.id, i]));
  const sorted = [...S.tasks].sort((x, y) => (rank.get(x.areaId) ?? 99) - (rank.get(y.areaId) ?? 99) || byOrder(x, y));
  const open = sorted.filter(t => t.status !== 'done'), done = sorted.filter(t => t.status === 'done');
  const todayIds = dayItems(todayStr()).map(it => it.taskId).filter(Boolean);
  // 今日正在推进: how many different tasks today's list is linked to (the highlighted ones)
  const pushing = new Set(todayIds.filter(id => T(id))).size;
  return `<aside class="bt" aria-label="${tr('bt.label')}">
    <div class="bt-h"><h2>${tr('bt.h')}</h2><span class="n">${tr('bt.pushing', { n: pushing })}</span></div>
    ${open.length ? `<ul class="bt-list">${open.map(t => bigTaskItem(t, todayIds)).join('')}</ul>` : `<p class="empty-note bt-empty">${tr('bt.empty')}</p>`}
    ${done.length ? `<button class="bt-more" data-act="bt-done" aria-expanded="${DV.showDone}">${tr('bt.done', { n: done.length })} ${DV.showDone ? '▾' : '▸'}</button>
      ${DV.showDone ? `<ul class="bt-list">${done.map(t => bigTaskItem(t, todayIds)).join('')}</ul>` : ''}` : ''}
  </aside>`;
}
function mountToday() {
  const list = $('#dv-list');
  if (!list || !window.Sortable) return;
  S.sortables.push(Sortable.create(list, sortableOpts({
    handle: '.dv-grip',
    onEnd(evt) {
      endDrag();
      if (evt.oldIndex === evt.newIndex) return;
      const order = [...list.children].map(li => li.dataset.id);
      const items = dayItems(DV.date);
      dvWrite(DV.date, order.map(id => items.find(x => x.id === id)).filter(Boolean));
    },
  })));
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act^="dv-"], [data-act="bt-done"]'); if (!el) return;
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case 'dv-day': DV.date = el.dataset.d; DV.moving = null; renderMain(); $('#dv-input')?.focus(); break;
    case 'dv-toggle': {
      let ticked = false;
      dvPatch(id, it => { it.done = !it.done; it.doneAt = it.done ? new Date().toISOString() : ''; ticked = it.done; });
      if (ticked) dvCheer(); // every item ticked off gets a little celebration
      break;
    }
    case 'dv-del': {
      const it = dayItems(DV.date).find(x => x.id === id);
      dvWrite(DV.date, dayItems(DV.date).filter(x => x.id !== id));
      if (it) toast(tr('dv.deleted', { t: trunc(it.text, 20) }));
      break;
    }
    case 'dv-link': { const t = T(el.dataset.task); if (t) dvPatch(id, it => { it.taskId = t.id; it.areaId = typeId(t.areaId); }); break; }
    case 'dv-nosug': dvPatch(id, it => { it.noSuggest = true; }); break;
    case 'dv-move': {
      if (DV.moving === id) { dvClosePop(); break; }
      const td = todayStr();
      DV.moving = id; DV.moveDate = DV.date === td ? addDays(td, 1) : td;
      renderMain(); $('#dv-mvdate')?.focus();
      break;
    }
    case 'dv-move-go': dvMoveTo(id, $('#dv-mvdate')?.value || DV.moveDate); break;
    case 'dv-new-use': {
      const t = T(el.dataset.task); if (!t) break;
      DV.newTask = t.id; DV.newArea = typeId(t.areaId) || 'none';
      dvNewPickers(); dvNewSug(); $('#dv-input')?.focus(); break;
    }
    case 'dv-new-nosug': DV.newSugOff = true; dvNewSug(); $('#dv-input')?.focus(); break;
    case 'bt-done': DV.showDone = !DV.showDone; renderMain(); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target; if (f.dataset.form !== 'dv-add') return;
  e.preventDefault();
  const text = String(new FormData(f).get('text') || '').trim(); if (!text) return;
  const items = dayItems(DV.date);
  items.push({ id: rid(), text, done: false, doneAt: '', areaId: typeId(DV.newArea), taskId: DV.newTask }); // not chosen = 其它
  DV.newArea = ''; DV.newTask = ''; DV.newSugOff = false;
  f.reset();
  dvWrite(DV.date, items);
  $('#dv-input')?.focus();
});
/* The add box's pickers follow the same rules as a row's; they are updated in place, since the page
   does not re-render while the box holds unsent text. */
/* DV.newArea: '' = not chosen yet (shows 「— 类型 —」, no colour), 'none' = 其它 picked, or a type id.
   Not chosen and 其它 are saved the same way (no type). */
function dvNewAreaOptions() {
  return `<option value="" ${DV.newArea ? '' : 'selected'}>${tr('dv.pickType')}</option>`
    + dvAreas().map(x => `<option value="${x.id}" ${x.id === DV.newArea ? 'selected' : ''}>${esc(x.name)}</option>`).join('')
    + `<option value="none" ${DV.newArea === 'none' ? 'selected' : ''}>${NONE.name}</option>`;
}
const dvNewAreaAttrs = () => DV.newArea ? `class="typed" style="--c:${esc(typeOf(DV.newArea).color)}"` : '';
/* While typing in the add box: suggest a task from the words typed (same rule as on a row). */
function dvNewSug() {
  const box = $('#dv-new-sug'); if (!box) return;
  const text = $('#dv-input')?.value || '';
  const sug = !DV.newTask && !DV.newSugOff && text.trim() ? dvSuggest(text) : null;
  box.innerHTML = sug ? `<span class="dv-sug"><button type="button" data-act="dv-new-use" data-task="${sug.id}" title="${esc(sug.title)}">${tr('dv.sug.use', { t: esc(trunc(sug.title, 24)) })}</button><button type="button" class="dv-sx" data-act="dv-new-nosug" title="${tr('dv.sug.no')}" aria-label="${tr('dv.sug.no')}">×</button></span>` : '';
}
function dvNewPickers() {
  const a = $('#dv-new-area'), k = $('#dv-new-task'); if (!a || !k) return;
  a.innerHTML = dvNewAreaOptions();
  a.classList.toggle('typed', !!DV.newArea); a.style.setProperty('--c', typeOf(DV.newArea).color);
  k.innerHTML = dvTaskOptions({ areaId: typeId(DV.newArea), taskId: DV.newTask });
  dvNewSug();
}
document.addEventListener('change', e => {
  const t = e.target, id = t.dataset && t.dataset.id;
  if (t.id === 'dv-new-area') { DV.newArea = t.value; if (DV.newTask && typeId(T(DV.newTask)?.areaId) !== typeId(t.value)) DV.newTask = ''; dvNewPickers(); return; }
  if (t.id === 'dv-new-task') { DV.newTask = t.value; if (t.value && T(t.value)) DV.newArea = typeId(T(t.value).areaId) || 'none'; dvNewPickers(); return; }
  if (!id) return;
  if (t.classList.contains('dv-text')) {
    const text = t.value.trim();
    if (!text) { dvWrite(DV.date, dayItems(DV.date).filter(x => x.id !== id)); return; }
    dvPatch(id, it => { it.text = text; });
  } else if (t.classList.contains('dv-area')) {
    dvPatch(id, it => { it.areaId = t.value; if (it.taskId && T(it.taskId) && T(it.taskId).areaId !== t.value) it.taskId = ''; });
  } else if (t.classList.contains('dv-task')) {
    dvPatch(id, it => { it.taskId = t.value; if (t.value && T(t.value)) it.areaId = typeId(T(t.value).areaId); });
  }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('dv-text')) { e.preventDefault(); e.target.blur(); }
  if (e.key === 'Escape' && DV.moving && !S.modal && !S.drawer) dvClosePop();
});
document.addEventListener('click', e => {
  if (DV.moving && !e.target.closest('.dv-pop, [data-act="dv-move"]')) dvClosePop();
}, true);
document.addEventListener('input', e => {
  if (e.target.id === 'dv-input') { dvNewSug(); return; }
  if (e.target.id !== 'dv-mvdate') return;
  DV.moveDate = e.target.value;
  const go = $('[data-act="dv-move-go"]');
  if (go) go.disabled = !DV.moveDate || DV.moveDate === DV.date;
});

/* ================= Events ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  switch (act) {
    case 'view': if (!recentlyDragged()) setView(el.dataset.view); break;
    case 'area':
      S.filter.area = el.dataset.area; lsSet('weisy.area', S.filter.area);
      renderFilters(); renderMain(); break;
    case 'new-task': openTask(null); break;
    case 'lang': {
      const l = LANG === 'en' ? 'zh' : 'en';
      setLang(l);
      if (!Store.db) break;
      switchExamples(l);
      S.langSaving = (S.langSaving || 0) + 1; // a settings echo from before this save must not switch back
      put('settings', 'ui', { ...uiSettings(), lang: l }).then(() => { S.langSaving--; syncLang(); });
      break;
    }
    case 'export': exportData(); break;
    case 'toggle': toggleDone(id); break;
    case 'edit':
      if (Date.now() - S.justDragged < 300) return;
      openTask(id || el.dataset.id); break;
    case 'show-all-done': S.showAllDone = true; renderMain(); break;
    case 'open-ms':
      if (Date.now() - S.justDragged < 300) return; // a board card that was just dragged
      openMs(id); break;
    case 'close-drawer': closeDrawer(); break;
    case 'close-modal': closeModal(); break;
    case 'del-task': {
      if (!armed(el, tr('confirmDel'))) return;
      const t = T(id); closeModal(); del('tasks', id); if (t) toast(tr('dv.deleted', { t: t.title }));
      break;
    }
    case 'ms-toggle': msUpdate(ms => ms.map(m => m.id === el.dataset.mid ? { ...m, done: !m.done } : m)); break;
    case 'ms-del': msUpdate(ms => ms.filter(m => m.id !== el.dataset.mid)); break;
    case 'log-del': logUpdate(ls => ls.filter(l => l.id !== el.dataset.lid)); break;
  }
});
document.addEventListener('submit', e => {
  const f = e.target;
  e.preventDefault();
  const fd = new FormData(f);
  switch (f.dataset.form) {
    case 'quick': {
      const title = String(fd.get('title') || '').trim();
      if (!title) return;
      createTask({ title, areaId: typeId(S.filter.area) }).then(ok => { if (ok) $('#quickAdd')?.focus(); });
      f.reset();
      break;
    }
    case 'task': saveTask(f); break;
    case 'ms-add': {
      const title = String(fd.get('title') || '').trim(); if (!title) return;
      msUpdate(ms => [...ms, { id: rid(), title, due: String(fd.get('due') || ''), done: false }]);
      f.reset(); f.querySelector('input').focus(); break;
    }
  }
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.filter.q = e.target.value; renderMain(); }
});
document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('d-edit')) commitDrawerField(e.target); });
document.addEventListener('input', e => { if (e.target.id === 'dn-notes') fitNotes(e.target); });
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.id === 'dn-next') { e.preventDefault(); e.target.blur(); } });
document.addEventListener('focusout', () => {
  setTimeout(() => {
    if (S.drawerStale && !$('#drawer').contains(document.activeElement)) renderDrawer(false);
    if (S.mainStale) {
      const ae = document.activeElement;
      if (!(ae && ae.tagName === 'INPUT' && ae.type === 'text' && ae.value !== ae.defaultValue && $('#main').contains(ae))) { S.mainStale = false; renderMain(); }
    }
  }, 0);
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (S.modal) { closeModal(); return; }
    if (S.drawer) { closeDrawer(); return; }
  }
  const tag = e.target.tagName;
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(tag) || e.target.isContentEditable;
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('card')) { openMs(e.target.dataset.id); return; }
  if (S.modal || S.status !== 'ready') return;
  if (e.key === 'n' || e.key === 'N') { e.preventDefault(); openTask(null); return; }
  const m = /^[1-9]$/.test(e.key) ? modulesOrdered()[Number(e.key) - 1] : null;
  if (m && !S.drawer) setView(m.id);
});

/* ================= Boot ================= */
window.addEventListener('weisy-offline', () => { $('#offline').hidden = false; });
window.addEventListener('weisy-online', () => { $('#offline').hidden = true; });

async function init() {
  const hv = (location.hash || '').slice(1);
  S.view = MODULES.some(m => m.id === hv) ? hv : (lsGet('weisy.view') || 'today');
  if (!MODULES.some(m => m.id === S.view)) S.view = 'today';
  S.filter.area = lsGet('weisy.area') || 'all';
  $('#ver').textContent = APP_VERSION;
  applyStatic();
  renderAll();

  const use = window.weisyStore && typeof window.weisyStore.use === 'function' ? n => window.weisyStore.use(n).catch(() => null) : async () => null;
  const [db, dl] = await Promise.all([use('db'), use('downloads')]);
  S.dl = dl;
  $('#exportBtn').hidden = !dl;
  if (!db) { S.status = 'nodb'; renderAll(); return; }
  Store.db = db;
  $('#importWrap').hidden = false;
  mountTabs();
  S.gigPath = lsGet('weisy.gpath') || '';
  COLLECTIONS.forEach(name => {
    Store.subscribe(name, docs => {
      S[name] = docs;
      S.loaded.add(name);
      if (name === 'settings') syncLang();
      if (S.loaded.size === COLLECTIONS.length) {
        S.status = 'ready';
        if (S.filter.area !== 'all' && S.filter.area !== 'none' && !A(S.filter.area)) S.filter.area = 'all';
      }
      scheduleRender();
    }, () => { S.status = 'error'; renderAll(); });
  });
}
init();
})();
</script>
